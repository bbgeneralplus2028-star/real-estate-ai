<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real Estate AI SaaS</title>
<style>
body { font-family: Arial; background:#0f0f0f; color:white; padding:20px; }
input, button { width:95%; padding:10px; margin:5px; }
.card { border:1px solid #444; padding:15px; margin-top:10px; }
</style>
</head>
<body>

<h2>🏠 AI Deal SaaS Dashboard</h2>

<input id="purchase" placeholder="Purchase Price">
<input id="arv" placeholder="ARV">
<input id="sqft" placeholder="Square Footage">
<input id="condition" placeholder="Cost per SqFt">
<input id="months" placeholder="Months">

<button onclick="run()">Analyze Deal</button>

<div id="out"></div>

<script>
async function run(){

let res = await fetch("https://YOUR-BACKEND-URL.onrender.com/analyze", {
method:"POST",
headers:{"Content-Type":"application/json"},
body: JSON.stringify({
purchase: +document.getElementById("purchase").value,
arv: +document.getElementById("arv").value,
sqft: +document.getElementById("sqft").value,
condition: +document.getElementById("condition").value,
months: +document.getElementById("months").value
})
});

let data = await res.json();

document.getElementById("out").innerHTML = `
<div class="card">
<h3>Strategy: ${data.strategy}</h3>
<p>Profit: $${data.profit.toFixed(0)}</p>
<p>Total Investment: $${data.total.toFixed(0)}</p>
<p>Transformation Cost: $${data.transformation.toFixed(0)}</p>
</div>
`;
}
</script>

</body>
</html>
